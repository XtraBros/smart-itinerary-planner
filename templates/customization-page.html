<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Backend Management System</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .section { margin-bottom: 40px; }
    label { display: block; margin-top: 10px; }
    input, select, button { margin-top: 5px; padding: 8px; width: 100%; }
    .status-message { margin-top: 10px; font-weight: bold; }
    .error { color: red; }
    .success { color: green; }
  </style>
</head>
<body>

  <h2>🔧 Configure RAG Platform</h2>
  <div class="section">
    <label>Upload CSV File</label>
    <input type="file" id="csvUpload" accept=".csv" />

    <label>OR Select Index File</label>
    <input type="file" id="indexUpload" accept=".faiss" />

    <button onclick="uploadRAGConfig()">Initialize RAG</button>
    <div id="rag-status" class="status-message"></div>
  </div>

  <h2>🤖 Configure LLM Pipeline</h2>
  <div class="section">
    <form id="model-config-form">
      <label for="provider">Model Provider:</label>
      <select id="provider" name="provider" required>
        <option value="openai">OpenAI</option>
        <option value="huggingface">HuggingFace</option>
        <option value="zhipu">Zhipu</option>
        <option value="google">Google</option>
        <option value="deepseek">DeepSeek</option>
      </select>
    
      <label for="model-name">Model Name:</label>
      <input type="text" id="model-name" name="model_name" required>
    
      <label for="api-key">API Key:</label>
      <input type="text" id="api-key" name="api_key" placeholder="Required unless using HuggingFace">
    
      <button type="submit">Update Model Settings</button>
    </form>
    <div id="llm-status" class="status-message"></div>
  </div>

  <h3>🌍 Update Mapbox Style URL</h3>
  <div class="section">
    <label for="mapStyleInput">Mapbox Style URL:</label>
    <input type="text" id="mapStyleInput" placeholder="e.g. mapbox://styles/your-style-id" required/>
    <button onclick="submitMapStyle()" style="margin-top: 10px;">Update Style URL</button>
    <div id="mapStyleStatus" class="status-message"></div>
  </div>

  <script>
    // RAG initialization handler
    async function uploadRAGConfig() {
      const csvFile = document.getElementById('csvUpload').files[0];
      const indexFile = document.getElementById('indexUpload').files[0];
      const formData = new FormData();

      if (csvFile) formData.append("csv", csvFile);
      if (indexFile) formData.append("index", indexFile);

      const status = document.getElementById('rag-status');
      status.textContent = '⏳ Initializing...';

      try {
        const res = await fetch('/api/init_rag', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        status.textContent = `✅ RAG initialized: ${data.message}`;
        status.className = "status-message success";
      } catch (err) {
        status.textContent = `❌ Failed to initialize RAG`;
        status.className = "status-message error";
        console.error(err);
      }
    }

    // LLM config update handler
    document.getElementById('model-config-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const provider = document.getElementById('provider').value;
      const model = document.getElementById('model-name').value;
      const apiKey = document.getElementById('api-key').value;
      const status = document.getElementById('llm-status');
      status.textContent = '⏳ Updating...';

      try {
        const res = await fetch('/api/update_llm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ provider, model, api_key: apiKey })
        });
        const data = await res.json();
        status.textContent = `✅ LLM updated: ${data.message}`;
        status.className = "status-message success";
      } catch (err) {
        status.textContent = `❌ Failed to update LLM`;
        status.className = "status-message error";
        console.error(err);
      }
    });

    // Mapbox style update handler
    function submitMapStyle() {
      const styleUrl = document.getElementById('mapStyleInput').value;
      const status = document.getElementById('mapStyleStatus');
      status.textContent = '⏳ Updating...';

      fetch('/update_map_style', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mapbox_style_url: styleUrl })
      })
      .then(res => res.json())
      .then(data => {
        if (data.error) {
          status.textContent = `❌ ${data.error}`;
          status.className = "status-message error";
        } else {
          status.textContent = `✅ Style updated: ${data.style_url}`;
          status.className = "status-message success";
        }
      })
      .catch(err => {
        console.error(err);
        status.textContent = "❌ Failed to update style";
        status.className = "status-message error";
      });
    }
  </script>

</body>
</html>
