{% extends "home.html" %}
{% block content %}
<div id="map-manager" class="tab-content" style="display: block;">
    <h3>🌍 Update Mapbox Style URL</h3>
    <h3>🗺️ Live Map Preview</h3>
    <div id="mapPreview" style="width: 100%; height: 400px; margin-top: 15px; border: 1px solid #ccc;"></div>
    <br>
    <h3>🛠️ Map Settings</h3>
    <label for="mapStyleInput">Mapbox Style URL:</label>
    <input type="text" id="mapStyleInput" placeholder="e.g. mapbox://styles/your-style-id" style="width: 500px;" required />
    <br><br>
    <label for="mapCenterInput" style="margin-top: 10px;">Map Center (lng, lat):</label>
    <input type="text" id="mapCenterInput" placeholder="e.g. 103.8198, 1.3521" style="width: 200px;" required />
    <br><br>
    <button onclick="submitMapSettings()" style="margin-top: 10px;">Update Map Settings</button>
    <div id="mapStyleStatus" class="status-message"></div>

  <script>
    function submitMapSettings() {
        const styleUrl = document.getElementById('mapStyleInput').value.trim();
        const centreInput = document.getElementById('mapCenterInput').value.trim();
        const status = document.getElementById('mapStyleStatus');

        status.textContent = '⏳ Updating...';

        const payload = {};
        if (styleUrl) payload.mapbox_style_url = styleUrl;

        if (centreInput) {
            const centreArray = centreInput.split(',').map(Number);
            if (centreArray.length !== 2 || centreArray.some(isNaN)) {
                status.textContent = "❌ Invalid map centre format. Use 'lng,lat'.";
                status.className = "status-message error";
                return;
            }
            payload.map_centre = centreArray;
        }

        if (!payload.mapbox_style_url && !payload.map_centre) {
            status.textContent = "❌ Please provide either a style URL or map centre.";
            status.className = "status-message error";
            return;
        }

        fetch('/update_map_style', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if (data.error) {
                status.textContent = `❌ ${data.error}`;
                status.className = "status-message error";
            } else {
                status.textContent = `✅ Updated: ${data.message}`;
                status.className = "status-message success";
            }
        })
        .catch(err => {
            console.error(err);
            status.textContent = "❌ Failed to update";
            status.className = "status-message error";
        });
        fetchMapConfig(); // Refresh the config after update
    }

    function fetchMapConfig() {
        console.log("Fetching config...");
        fetch('/config')
            .then(res => res.json())
            .then(data => {
                const config = data.config;
                // Use placeholders instead of values
                if (config.MAPBOX_ACCESS_TOKEN) {
                    mapboxgl.accessToken = config.MAPBOX_ACCESS_TOKEN;
                } else {
                    console.error('MAPBOX_ACCESS_TOKEN missing from config');
                    return;
                }
                if (config.MAPBOX_STYLE_URL) {
                    document.getElementById('mapStyleInput').placeholder = config.MAPBOX_STYLE_URL;
                }
                if (config.MAP_CENTRE) {
                    try {
                        const parsed = JSON.parse(config.MAP_CENTRE);
                        if (Array.isArray(parsed) && parsed.length === 2 && parsed.every(val => typeof val === 'number')) {
                            document.getElementById('mapCenterInput').placeholder = parsed.join(', ');
                        } else {
                            console.warn('Invalid MAP_CENTRE format:', config.MAP_CENTRE);
                        }
                    } catch (e) {
                        console.error('Error parsing MAP_CENTRE:', e);
                    }
                }
            })
            .catch(err => {
                console.error('Failed to fetch config:', err);
                document.getElementById('mapStyleStatus').textContent = "⚠️ Unable to fetch config";
            });
    }

    // Fetch config on page load
    window.addEventListener('DOMContentLoaded', fetchMapConfig);
  </script>
  <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
  <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
  <script>
    let map; // Global reference to the map instance

    function initializeMap(styleURL, center) {
        if (map) {
            // If map already exists, update its style and center
            map.setStyle(styleURL);
            map.setCenter(center);
            return;
        }

        // Initialize the map
        map = new mapboxgl.Map({
            container: 'mapPreview',
            style: styleURL,
            center: center,
            zoom: 12
        });

        new mapboxgl.Marker().setLngLat(center).addTo(map);
    }

    function fetchMapConfig() {
        console.log("Fetching config...");
        fetch('/config')
            .then(res => res.json())
            .then(data => {
                const config = data.config;
                let styleURL = config.MAPBOX_STYLE_URL;
                let center = [103.8198, 1.3521]; // Default center

                if (styleURL) {
                    document.getElementById('mapStyleInput').placeholder = styleURL;
                }

                if (config.MAP_CENTRE) {
                    try {
                        const parsed = JSON.parse(config.MAP_CENTRE);
                        if (Array.isArray(parsed) && parsed.length === 2 && parsed.every(val => typeof val === 'number')) {
                            center = parsed;
                            document.getElementById('mapCenterInput').placeholder = parsed.join(', ');
                        } else {
                            console.warn('Invalid MAP_CENTRE format:', config.MAP_CENTRE);
                        }
                    } catch (e) {
                        console.error('Error parsing MAP_CENTRE:', e);
                    }
                }

                if (styleURL && center) {
                    initializeMap(styleURL, center);
                }
            })
            .catch(err => {
                console.error('Failed to fetch config:', err);
                document.getElementById('mapStyleStatus').textContent = "⚠️ Unable to fetch config";
            });
    }

    function submitMapSettings() {
        const styleUrl = document.getElementById('mapStyleInput').value.trim();
        const centreInput = document.getElementById('mapCenterInput').value.trim();
        const status = document.getElementById('mapStyleStatus');

        status.textContent = '⏳ Updating...';

        const payload = {};
        if (styleUrl) payload.mapbox_style_url = styleUrl;

        if (centreInput) {
            const centreArray = centreInput.split(',').map(Number);
            if (centreArray.length !== 2 || centreArray.some(isNaN)) {
                status.textContent = "❌ Invalid map centre format. Use 'lng,lat'.";
                status.className = "status-message error";
                return;
            }
            payload.map_centre = centreArray;
        }

        if (!payload.mapbox_style_url && !payload.map_centre) {
            status.textContent = "❌ Please provide either a style URL or map centre.";
            status.className = "status-message error";
            return;
        }

        fetch('/update_map_style', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if (data.error) {
                status.textContent = `❌ ${data.error}`;
                status.className = "status-message error";
            } else {
                status.textContent = `✅ Updated: ${data.message}`;
                status.className = "status-message success";

                // Update map preview immediately with new values
                const updatedStyle = data.style_url || document.getElementById('mapStyleInput').placeholder;
                const updatedCentre = data.map_centre || document.getElementById('mapCenterInput').placeholder.split(',').map(Number);

                initializeMap(updatedStyle, updatedCentre);
            }
        })
        .catch(err => {
            console.error(err);
            status.textContent = "❌ Failed to update";
            status.className = "status-message error";
        });
    }

    window.addEventListener('DOMContentLoaded', fetchMapConfig);
</script>

</div>
{% endblock %}
