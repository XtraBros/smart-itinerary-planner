<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Backend Management</title>

    <!-- GoldenLayout CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/golden-layout@1.5.9/src/css/goldenlayout-base.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/golden-layout@1.5.9/src/css/goldenlayout-light-theme.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />

    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Landing page styles */
        #landing-page {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            background-color: #f5f5f5;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            width: 80%;
            max-width: 800px;
        }

        .grid-button {
            padding: 30px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, transform 0.2s;
        }

        .grid-button:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        /* GoldenLayout container */
        #golden-layout-container {
            display: none;
            height: 100%;
            width: 100%;
        }

        /* Sidebar & main area */
        .layout-container {
            display: flex;
            height: 100%;
        }

        .sidebar {
            width: 220px;
            background: #333;
            color: white;
            padding: 10px;
            box-sizing: border-box;
            transition: width 0.3s;
        }

        .sidebar.collapsed { width: 50px; }

        #main-area { flex: 1; }

        .sidebar-toggle { cursor: pointer; margin-bottom: 10px; }

        .sidebar ul { list-style: none; padding: 0; }

        .sidebar ul li { padding: 10px; cursor: pointer; }
        .sidebar ul li:hover { background: #444; }
    </style>
</head>
<body>

    <!-- Landing page -->
    <div id="landing-page">
        <!-- <div class="grid-container">
            <button class="grid-button" data-component="llm-manager" data-title="Model Manager">Model Manager</button>
            <button class="grid-button" data-component="rag-manager" data-title="RAG Manager">RAG Manager</button>
            <button class="grid-button" data-component="map-manager" data-title="Map Manager">Map Manager</button>
            <button class="grid-button" data-component="analytics" data-title="Analytics">Analytics</button>
            <button class="grid-button" data-component="graph-viewer" data-title="Graph Viewer">Graph Viewer</button>
        </div> -->
    </div>

    <!-- GoldenLayout container -->
    <div id="golden-layout-container">
        <div class="layout-container">
            <div class="sidebar" id="sidebar">
                <div id="sidebar-toggle" class="sidebar-toggle">☰</div>
                <ul id="menu">
                    <li data-component="llm-manager" data-title="Model Manager">Model Manager</li>
                    <li data-component="rag-manager" data-title="RAG Manager">POI Data Manager</li>
                    <li data-component="map-manager" data-title="Map Manager">Map Manager</li>
                    <li data-component="analytics" data-title="Analytics">Analytics</li>
                    <li data-component="graph-viewer" data-title="Graph Viewer">Graph Viewer</li>
                </ul>
            </div>
            <div id="main-area"></div>
        </div>
    </div>

    <!-- Full-page overlay -->
    <div id="landing-overlay">
        <div class="grid-container">
            <button class="grid-button" data-component="llm-manager" data-title="Model Manager">Model Manager</button>
            <button class="grid-button" data-component="rag-manager" data-title="RAG Manager">POI Data Manager</button>
            <button class="grid-button" data-component="map-manager" data-title="Map Manager">Map Manager</button>
            <button class="grid-button" data-component="analytics" data-title="Analytics">Analytics</button>
            <button class="grid-button" data-component="graph-viewer" data-title="Graph Viewer">Graph Viewer</button>
        </div>
    </div>

    <style>
        /* Overlay styles */
        #landing-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(245,245,245,1); /* opaque */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            width: 80%;
            max-width: 800px;
            text-align: center;
        }

        .grid-button {
            padding: 30px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, transform 0.2s;
        }

        .grid-button:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }
    </style>


    <!-- JS libraries -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/golden-layout@1.5.9/dist/goldenlayout.min.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>

    <script>
        const landingPage = document.getElementById("landing-page");
        const goldenContainer = document.getElementById("golden-layout-container");

        // Landing page buttons
        document.querySelectorAll('.grid-button').forEach(btn => {
            btn.addEventListener('click', () => {
                const component = btn.dataset.component;
                const title = btn.dataset.title;

                // Hide landing page, show GoldenLayout
                landingPage.style.display = "none";
                goldenContainer.style.display = "block";

                // Open the selected component
                if (window.openComponent) {
                    window.openComponent(component, title);
                }
            });
        });
    </script>
</body>
</html>
