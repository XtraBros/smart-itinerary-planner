<!-- layout.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Backend Management</title>
    <!-- Mapbox GL JS CSS -->
    <link
    href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
    rel="stylesheet"
    />

    <!-- Mapbox GL JS library -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <!-- GoldenLayout 1.x CSS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/golden-layout@1.5.9/src/css/goldenlayout-base.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/golden-layout@1.5.9/src/css/goldenlayout-light-theme.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />
</head>
<body>
    <!-- Sidebar toggle button -->
    <div class="layout-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div id="sidebar-toggle" class="sidebar-toggle">☰</div>
            <ul id="menu">
                <li data-component="llm-manager" data-title="Model Manager">Model Manager</li>
                <li data-component="rag-manager" data-title="RAG Manager">RAG Manager</li>
                <li data-component="map-manager" data-title="Map Manager">Map Manager</li>
                <li data-component="analytics" data-title="Analytics">Analytics</li>
                <li data-component="graph-viewer" data-title="Graph Viewer">Graph Viewer</li>
            </ul>
        </div>

        <!-- Main layout area -->
        <div id="main-area"></div>
    </div>

    <!-- GoldenLayout 1.x JS -->
    <script src="https://cdn.jsdelivr.net/npm/golden-layout@1.5.9/dist/goldenlayout.min.js"></script>

    <!-- Your custom JS -->
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>

    <!-- Sidebar toggle script -->
    <script>
        const sidebar = document.getElementById("sidebar");
        const toggleBtn = document.getElementById("sidebar-toggle");
        const mainArea = document.getElementById("main-area");

        toggleBtn.addEventListener("click", () => {
            sidebar.classList.toggle("collapsed");
            mainArea.classList.toggle("expanded");
        });
    </script>
</body>
</html>
