<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RAG Unit Manager</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .unit-card { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 6px; }
    .remove-btn { color: white; background-color: red; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
    .add-btn { color: white; background-color: gray; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; }
  </style>
</head>
<body>

  <h1>RAG Unit Manager</h1>

  <div id="unit-container" class="unit-grid"></div>

  <button class="add-btn" onclick="openAddModal()">Add New Unit</button>
  <div id="loadingModal" style="display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); color: white; display: flex; align-items: center; justify-content: center; text-align: center;">
    <div>
        <h2 id="loadingText">Loading...</h2>
    </div>
  </div>
  <!-- Add Unit Modal -->
  <div id="addModal" style="display:none; position:fixed; top:0; left:0; 
      width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:white; padding:20px; border-radius:8px; width:400px; position:relative;">
      <h3>Add New RAG Unit</h3>
      <div>
        <label>Unit Name:</label>
        <input type="text" id = "unitName" name="unitName" required>
      </div>
      <div>
        <label>Description:</label>
        <input type="text" id="unitDescription" style="width:100%"><br><br>
      </div>
      <label>Source Type:</label>
      <select id="sourceType" name="sourceType" onchange="updateSourceFields()">
        <option value="">-- Select Source --</option>
        <option value="csv">CSV</option>
        <option value="index">Index</option>
        <option value="mongodb">MongoDB</option>
        <option value="sql">SQL</option>
        <option value="json">JSON</option>
      </select>
      
      <div id="csv-fields" style="display:none;">
          <label>Upload CSV File:</label>
          <input type="file" id="csvFile">
      </div>
      <div id="json-fields" style="display:none;">
        <label>Upload JSON File:</label>
        <input type="file" id="jsonFile">
    </div>
      
      <div id="index-fields" style="display:none;">
          <label>Upload Index File (.pkl or .index):</label>
          <input type="file" id="indexFile">
      </div>
      
      <div id="mongodb-fields" style="display:none;">
          <label>Mongo URI:</label>
          <input type="text" id="mongoUrl"><br>
          <label>Database:</label>
          <input type="text" id="mongoDb"><br>
          <label>Collection:</label>
          <input type="text" id="mongoCollection"><br>
      </div>
      
      <div id="sql-fields" style="display:none;">
          <label>SQL Host:</label>
          <input type="text" id="host"><br>
          <label>Port:</label>
          <input type="text" id="port"><br>
          <label>User:</label>
          <input type="text" id="user"><br>
          <label>Password:</label>
          <input type="pw" id="pw"><br>
          <label>Database:</label>
          <input type="text" id="database"><br>
          <label>Query:</label>
          <textarea name="query"></textarea><br>
      </div>
      <br>
      <button onclick="submitAddUnit()">Submit</button>
      <button onclick="closeAddModal()">Cancel</button>
    </div>
  </div>
  <script>
    function updateSourceFields() {
        const source = document.getElementById("sourceType").value;
    
        // Hide all dynamic input sections first
        document.getElementById("csv-fields").style.display = "none";
        document.getElementById("json-fields").style.display = "none";
        document.getElementById("index-fields").style.display = "none";
        document.getElementById("mongodb-fields").style.display = "none";
        document.getElementById("sql-fields").style.display = "none";
    
        // Show the appropriate section
        if (source === "csv") {
            document.getElementById("csv-fields").style.display = "block";
        } else if (source === "index") {
            document.getElementById("index-fields").style.display = "block";
        } else if (source === "mongodb") {
            document.getElementById("mongodb-fields").style.display = "block";
        } else if (source === "sql") {
            document.getElementById("sql-fields").style.display = "block";
        } else if (source === "json") {
            document.getElementById("json-fields").style.display = "block";
        }
    }

    function openAddModal() {
    document.getElementById("addModal").style.display = "flex";
    }

    function closeAddModal() {
    document.getElementById("addModal").style.display = "none";
    }

    async function submitAddUnit() {
        const formData = new FormData();

        const nameEl = document.getElementById("unitName");
        const descEl = document.getElementById("unitDescription");
        const sourceEl = document.getElementById("sourceType");

        if (!nameEl || !descEl || !sourceEl) {
            return alert("Missing required fields in the form.");
        }

        const name = nameEl.value.trim();
        const description = descEl.value.trim();
        const source = sourceEl.value;

        if (!name) return alert("Please enter a unit name.");
        formData.append("unit_name", name);
        formData.append("description", description);
        formData.append("source", source);

        if (source === "csv") {
            const fileInput = document.getElementById("csvFile");
            if (!fileInput || !fileInput.files[0]) return alert("Please select a CSV file.");
            formData.append("file", fileInput.files[0]);

        } else if (source === "mongodb") {
            const urlEl = document.getElementById("mongoURL");
            const dbEl = document.getElementById("mongoDB");
            const collEl = document.getElementById("mongoCollection");

            if (!urlEl || !dbEl || !collEl) return alert("MongoDB input fields are missing.");
            if (!urlEl.value || !dbEl.value || !collEl.value)
                return alert("Please fill in all MongoDB connection details.");

            formData.append("mongo_url", urlEl.value);
            formData.append("mongo_db", dbEl.value);
            formData.append("mongo_collection", collEl.value);

        } else if (source === "sql") {
            const host = document.getElementById("host")?.value;
            const port = document.getElementById("port")?.value;
            const user = document.getElementById("user")?.value;
            const pass = document.getElementById("pw")?.value;
            const db = document.getElementById("database")?.value;
            const query = document.getElementById("query")?.value;

            if (!host || !db || !query) return alert("Please enter SQL host, database, and query.");

            formData.append("host", host);
            formData.append("port", port || "");
            formData.append("user", user || "");
            formData.append("pw", pass || "");
            formData.append("database", db);
            formData.append("query", query);
        }

        // ✅ Close the modal and show loading before request
        showLoadingModal("Adding RAG Unit...");

        try {
            const res = await fetch("/api/add_unit", {
                method: "POST",
                body: formData
            });

            if (res.ok) {
                hideLoadingModal();
                closeAddModal();
                alert("RAG Unit added successfully.");
                fetchUnits();
            } else {
                const err = await res.json();
                hideLoadingModal();
                alert(`Failed to add unit: ${err.error}`);
            }
        } catch (e) {
            hideLoadingModal();
            alert("Request failed: " + e.message);
        }
    }
    function showLoadingModal(message = "Loading...") {
        const loadingModal = document.getElementById("loadingModal");
        const loadingText = document.getElementById("loadingText");
        if (loadingModal) loadingModal.style.display = "block";
        if (loadingText) loadingText.textContent = message;
    }

    function hideLoadingModal() {
        const loadingModal = document.getElementById("loadingModal");
        if (loadingModal) loadingModal.style.display = "none";
    }
  </script>
  <script>
    async function fetchUnits() {
        const response = await fetch("/api/get_units");
        const data = await response.json();
    
        const container = document.getElementById("unit-container");
        container.innerHTML = "";
    
        const colorMap = {
            csv: "#dce775",
            sql: "#81d4fa",
            mongo: "#ffcc80",
            json: "#ce93d8",
            cms: "#a5d6a7",
            unknown: "#eeeeee"
        };
    
        data.units.forEach(unit => {
            const unitBox = document.createElement("div");
            unitBox.className = "unit-box";
            unitBox.style.backgroundColor = colorMap[unit.source_type] || "#f0f0f0";
    
            unitBox.innerHTML = `
                <h3>${unit.name.toUpperCase()}</h3>
                <p>Source: ${unit.source_type}</p>
                <p>Description: ${unit.description}</p>
                <button onclick="confirmDeleteUnit('${unit.id}')">🗑 Delete</button>
            `;
    
            container.appendChild(unitBox);
        });
    }
    
    function confirmDeleteUnit(id) {
        if (confirm("Are you sure you want to delete this RAG Unit?")) {
            deleteUnit(id);
        }
    }
    
    async function deleteUnit(id) {
        console.log("Deleting unit with ID:", id);
        const res = await fetch(`/api/delete_unit`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ unit_id: id })
        });

        if (res.ok) {
            alert("Unit deleted.");
            fetchUnits();  // Refresh list
        } else {
            alert("Failed to delete unit.");
        }
    }

    // Load units when the page loads
    window.onload = function() {
        fetchUnits();
        hideLoadingModal();
    };
    </script>
    
    <style>
    .unit-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 16px;
        padding: 20px;
    }
    .unit-box {
        border: 1px solid #ccc;
        border-radius: 10px;
        padding: 12px;
        box-shadow: 0 1px 5px rgba(0,0,0,0.1);
    }
    .unit-box h3 {
        margin-top: 0;
    }
    .unit-box button {
        margin-top: 10px;
        padding: 5px 10px;
        background-color: #e57373;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    .unit-box button:hover {
        background-color: #c62828;
    }
    </style>
</body>
</html>
