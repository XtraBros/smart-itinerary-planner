<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Map Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.5.0/mapbox-gl-draw.css" rel="stylesheet" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #1f2937;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    main {
      padding: 2rem;
      max-width: 700px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: 600;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.3rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    button {
      margin-top: 1rem;
      padding: 0.6rem 1.2rem;
      background-color: #1f2937;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background-color: #374151;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    .button-row button {
      margin-top: 0;
    }

    .helper-text {
      color: #4b5563;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }

    .spotlight-card {
      margin-top: 1.5rem;
      padding: 1rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background-color: #f9fafb;
    }

    .status-message {
      margin-top: 1rem;
      font-weight: 600;
    }

    .status-message.success {
      color: green;
    }

    .status-message.error {
      color: red;
    }

    .map-preview-wrapper {
      position: relative;
      margin-top: 1rem;
    }

    .map-preview-controls {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 0.5rem;
      z-index: 5;
    }

    .map-preview-controls button {
      background: rgba(31, 41, 55, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      font-size: 0.85rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .map-preview-controls button.active {
      background: #f97316;
      border-color: #fb923c;
    }

    #mapPreview {
      width: 100%;
      height: 420px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <header>
    <h1>🗺️ Map Manager</h1>
  </header>

  <main id="map-manager" class="tab-content" style="display: block;">
    <h3>🌍 Update Mapbox Style URL</h3>
    <div class="map-preview-wrapper">
      <div id="mapPreview"></div>
      <div class="map-preview-controls">
        <button
          id="startDrawBtn"
          type="button"
          onclick="window.startSpotlightDraw && window.startSpotlightDraw()"
        >
          📐 Draw Spotlight
        </button>
      </div>
    </div>

    <h3>🛠️ Map Settings</h3>
    <label for="mapStyleInput">Mapbox Style URL:</label>
    <input
      type="text"
      id="mapStyleInput"
      placeholder="e.g. mapbox://styles/your-style-id"
      required
    />

    <label for="mapCenterInput">Map Center (lng, lat):</label>
    <input
      type="text"
      id="mapCenterInput"
      placeholder="e.g. 103.8198, 1.3521"
      required
    />

    <button
      id="updateMapSettingsBtn"
      type="button"
      onclick="window.submitMapSettings && window.submitMapSettings()"
    >
      Update Map Settings
    </button>

    <div id="mapStyleStatus" class="status-message"></div>

    <h3>🔦 Spotlight Area</h3>
    <p class="helper-text">
      Use the polygon (<strong>⬠</strong>) and trash icons that appear on the map to draw or remove the spotlight area.
      The highlighted polygon will remain transparent for end users, while the rest of the map is masked.
    </p>

    <div class="spotlight-card">
      <div id="polygonSummary" class="helper-text"></div>
      <div class="button-row" style="margin-top: 1rem;">
        <button
          id="clearSpotlightBtn"
          type="button"
          style="background-color:#b91c1c;"
          onclick="window.clearSpotlightPolygon && window.clearSpotlightPolygon()"
        >
          Clear Spotlight
        </button>
        <button
          id="saveSpotlightBtn"
          type="button"
          onclick="window.saveSpotlightPolygon && window.saveSpotlightPolygon()"
        >
          Save Spotlight
        </button>
      </div>
      <div id="polygonStatus" class="status-message"></div>
    </div>
  </main>

  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <script src="{{ url_for('static', filename='js/map-manager.js') }}"></script>
</body>
</html>
