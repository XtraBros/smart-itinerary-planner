<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Map Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #1f2937;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    main {
      padding: 2rem;
      max-width: 700px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: 600;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.3rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    button {
      margin-top: 1rem;
      padding: 0.6rem 1.2rem;
      background-color: #1f2937;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background-color: #374151;
    }

    .status-message {
      margin-top: 1rem;
      font-weight: 600;
    }

    .status-message.success {
      color: green;
    }

    .status-message.error {
      color: red;
    }

    #mapPreview {
      width: 100%;
      height: 400px;
      margin-top: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <header>
    <h1>🗺️ Map Manager</h1>
  </header>

  <main id="map-manager" class="tab-content" style="display: block;">
    <h3>🌍 Update Mapbox Style URL</h3>
    <div id="mapPreview"></div>

    <h3>🛠️ Map Settings</h3>
    <label for="mapStyleInput">Mapbox Style URL:</label>
    <input
      type="text"
      id="mapStyleInput"
      placeholder="e.g. mapbox://styles/your-style-id"
      required
    />

    <label for="mapCenterInput">Map Center (lng, lat):</label>
    <input
      type="text"
      id="mapCenterInput"
      placeholder="e.g. 103.8198, 1.3521"
      required
    />

    <button onclick="submitMapSettings()">Update Map Settings</button>

    <div id="mapStyleStatus" class="status-message"></div>
  </main>

  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <script src="{{ url_for('static', filename='js/map-manager.js') }}"></script>
</body>
</html>
