<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Map Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #1f2937;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    main {
      padding: 2rem;
      max-width: 700px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: 600;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.3rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    button {
      margin-top: 1rem;
      padding: 0.6rem 1.2rem;
      background-color: #1f2937;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background-color: #374151;
    }

    .status-message {
      margin-top: 1rem;
      font-weight: 600;
    }

    .status-message.success {
      color: green;
    }

    .status-message.error {
      color: red;
    }

    #mapPreview {
      width: 100%;
      height: 400px;
      margin-top: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <header>
    <h1>🗺️ Map Manager</h1>
  </header>

  <main id="map-manager" class="tab-content" style="display: block;">
    <h3>🌍 Update Mapbox Style URL</h3>
    <div id="mapPreview"></div>

    <h3>🛠️ Map Settings</h3>
    <label for="mapStyleInput">Mapbox Style URL:</label>
    <input
      type="text"
      id="mapStyleInput"
      placeholder="e.g. mapbox://styles/your-style-id"
      required
    />

    <label for="mapCenterInput">Map Center (lng, lat):</label>
    <input
      type="text"
      id="mapCenterInput"
      placeholder="e.g. 103.8198, 1.3521"
      required
    />

    <button onclick="submitMapSettings()">Update Map Settings</button>

    <div id="mapStyleStatus" class="status-message"></div>
  </main>

  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <script>
    let map; // Global map instance

    function initializeMap(styleURL, center) {
      if (map) {
        map.setStyle(styleURL);
        map.setCenter(center);
        return;
      }

      map = new mapboxgl.Map({
        container: "mapPreview",
        style: styleURL,
        center: center,
        zoom: 12,
      });

      new mapboxgl.Marker().setLngLat(center).addTo(map);
    }

    function fetchMapConfig() {
      fetch("/config")
        .then((res) => res.json())
        .then((data) => {
          const config = data.config;
          let styleURL = config.MAPBOX_STYLE_URL;
          let center = [103.8198, 1.3521]; // default Singapore center

          if (styleURL) {
            document.getElementById("mapStyleInput").placeholder = styleURL;
          }

          if (config.MAP_CENTRE) {
            try {
              const parsed = JSON.parse(config.MAP_CENTRE);
              if (
                Array.isArray(parsed) &&
                parsed.length === 2 &&
                parsed.every((val) => typeof val === "number")
              ) {
                center = parsed;
                document.getElementById("mapCenterInput").placeholder =
                  parsed.join(", ");
              }
            } catch (e) {
              console.error("Error parsing MAP_CENTRE:", e);
            }
          }

          if (styleURL && center) {
            initializeMap(styleURL, center);
          }
        })
        .catch((err) => {
          console.error("Failed to fetch config:", err);
          document.getElementById("mapStyleStatus").textContent =
            "⚠️ Unable to fetch config";
          document.getElementById("mapStyleStatus").className =
            "status-message error";
        });
    }

    function submitMapSettings() {
      const styleUrl = document.getElementById("mapStyleInput").value.trim();
      const centreInput = document.getElementById("mapCenterInput").value.trim();
      const status = document.getElementById("mapStyleStatus");

      status.textContent = "⏳ Updating...";
      status.className = "status-message";

      const payload = {};
      if (styleUrl) payload.mapbox_style_url = styleUrl;

      if (centreInput) {
        const centreArray = centreInput.split(",").map(Number);
        if (centreArray.length !== 2 || centreArray.some(isNaN)) {
          status.textContent = "❌ Invalid map centre format. Use 'lng,lat'.";
          status.className = "status-message error";
          return;
        }
        payload.map_centre = centreArray;
      }

      if (!payload.mapbox_style_url && !payload.map_centre) {
        status.textContent =
          "❌ Please provide either a style URL or map centre.";
        status.className = "status-message error";
        return;
      }

      fetch("/update_map_style", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      })
        .then((res) => res.json())
        .then((data) => {
          if (data.error) {
            status.textContent = `❌ ${data.error}`;
            status.className = "status-message error";
          } else {
            status.textContent = `✅ Updated: ${data.message}`;
            status.className = "status-message success";

            // Update map preview immediately
            const updatedStyle =
              data.style_url || document.getElementById("mapStyleInput").placeholder;
            const updatedCentre =
              data.map_centre ||
              document
                .getElementById("mapCenterInput")
                .placeholder.split(",")
                .map(Number);

            initializeMap(updatedStyle, updatedCentre);
          }
        })
        .catch((err) => {
          console.error(err);
          status.textContent = "❌ Failed to update";
          status.className = "status-message error";
        });
    }

    window.addEventListener("DOMContentLoaded", fetchMapConfig);
  </script>
</body>
</html>
