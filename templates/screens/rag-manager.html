<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>POI Data Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tabulator.min.css') }}" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f9f9f9;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #1f2937;
            color: white;
            padding: 1rem;
            text-align: center;
        }

        main {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .unit-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            padding: 20px 0;
        }

        .unit-box {
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.1);
            background: #fff;
        }
        .unit-box h3 {
            margin-top: 0;
        }
        .unit-box button {
            margin-top: 10px;
            padding: 5px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: #fff;
        }
        .unit-box button:hover {
            opacity: 0.9;
        }
        .unit-box button.primary {
            background-color: #2563eb;
        }
        .unit-box button.danger {
            background-color: #e11d48;
        }
        .unit-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .sheet-panel {
            margin: 30px 0;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
            display: none;
            flex-direction: column;
            gap: 16px;
        }
        .sheet-panel.visible {
            display: flex;
        }
        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .sheet-actions button {
            margin-left: 8px;
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }
        .sheet-actions button.save {
            background-color: #059669;
            color: #fff;
        }
        .sheet-actions button.close {
            background-color: #f3f4f6;
            color: #111827;
            border: 1px solid #d1d5db;
        }
        #sheetContainer {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            min-height: 400px;
            overflow: hidden;
        }
        .sheet-actions button.add-row,
        .sheet-actions button.add-column {
            background-color: #2563eb;
            color: #fff;
        }
        .add-btn {
            background-color: #059669;
            color: #fff;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }
        .add-btn:hover {
            background-color: #047857;
        }

        body.sheet-only {
            background: #fff;
        }

        body.sheet-only header,
        body.sheet-only .page-description,
        body.sheet-only #unit-container,
        body.sheet-only .add-btn {
            display: none;
        }

        body.sheet-only main {
            max-width: none;
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body.sheet-only .sheet-panel {
            display: flex;
            border-radius: 0;
            margin: 0;
            min-height: 100vh;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>POI Data Manager</h1>
    </header>

    <main>
        <p class="page-description">Load any unit to view and edit its CSV directly within the browser.</p>

        <div id="unit-container" class="unit-grid"></div>
    
        <button class="add-btn" onclick="openAddModal()">Add New Unit</button>

        <section id="sheetPanel" class="sheet-panel">
            <div class="sheet-header">
                <div>
                    <h2 id="sheetTitle">POI Sheet</h2>
                    <p id="sheetMeta">Select a unit to begin editing.</p>
                </div>
                <div class="sheet-actions">
                    <button class="add-column" onclick="addSheetColumn()">➕ Add Column</button>
                    <button class="add-row" onclick="addSheetRow()">➕ Add Row</button>
                    <button class="save" onclick="saveSheetEdits()">💾 Save Changes</button>
                    <button class="close" onclick="closeSheetPanel()">Close</button>
                </div>
            </div>
            <div id="sheetContainer"></div>
        </section>
    
        <div
            id="loadingModal"
            style="display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); color: white; align-items: center; justify-content: center; text-align: center;"
        >
            <div>
                <h2 id="loadingText">Loading...</h2>
            </div>
        </div>
    
        <!-- Add Unit Modal -->
        <div
            id="addModal"
            style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; align-items:center; justify-content:center;"
        >
            <div
                style="background:white; padding:20px; border-radius:8px; width:400px; position:relative;"
            >
                <h3>Add New RAG Unit</h3>
                <div>
                    <label>Unit Name:</label>
                    <input type="text" id="unitName" name="unitName" required />
                </div>
                <div>
                    <label>Description:</label>
                    <input type="text" id="unitDescription" style="width:100%" /><br /><br />
                </div>
    
                <div>
                    <label>Upload CSV File:</label>
                    <input type="file" id="csvFile" />
                </div>
    
                <br />
                <button onclick="submitAddUnit()">Submit</button>
                <button onclick="closeAddModal()">Cancel</button>
            </div>
        </div>
    </main>
    <script src="{{ url_for('static', filename='js/rag-manager.js') }}"></script>
</body>
</html>
