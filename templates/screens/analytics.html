<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Tour Guide Analytics Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: auto; /* <-- allow scroll inside tab */
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
    
        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            max-width: 1200px;
            margin: auto;
            padding-bottom: 50px;
        }
    
        .card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            padding: 20px;
        }
    
        canvas {
            width: 100% !important;
            height: 400px !important;
        }
    
        @media (max-width: 768px) {
            .dashboard-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
    
</head>
<body>
    <h1>Tour Guide Analytics Dashboard</h1>

    <div class="dashboard-container">
        <div class="card">
            <h2>POI Popularity Heatmap</h2>
            <div id="poiHeatmap" style="height: 400px;"></div>
        </div>

        <div class="card">
            <h2>User Activity by Hour</h2>
            <canvas id="userActivityChart"></canvas>
        </div>

        <div class="card">
            <h2>POI Click Rate (Pie Chart)</h2>
            <canvas id="poiPieChart"></canvas>
        </div>
    </div>
</body>
</html>
